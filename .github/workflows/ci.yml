name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a run if a newer push/PR update supersedes it, so CI minutes aren't spent on
# builds nobody will look at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tagday
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug build
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tagday/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
