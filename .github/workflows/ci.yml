name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a run if a newer push/PR update supersedes it, so CI minutes aren't spent on
# builds nobody will look at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tagday
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Must match the toolchain in app/build.gradle.kts, so Gradle uses this JDK directly
          # rather than having foojay provision a second one (BACKLOG F27). 21 is not a
          # preference: Robolectric refuses to emulate Android SDK 36 on anything lower.
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + lint + debug build
        # lintDebug matters here: app/build.gradle.kts sets warningsAsErrors, and without this
        # step that gate only ever fires on a developer machine (BACKLOG F26).
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            tagday/app/build/reports/tests/testDebugUnitTest/
            tagday/app/build/reports/lint-results-debug.html
          retention-days: 7
